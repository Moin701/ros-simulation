amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    transform_tolerance: 1.5

    # Mirrors amr_navigation/config/amcl.yaml exactly (Milestone 2) - the
    # task that created this file only listed set_initial_pose/initial_pose
    # here, which would have silently dropped robot_model_type and left AMCL
    # back on the default DifferentialMotionModel (can't model mecanum
    # strafing at all - see decisions-and-gotchas.md's AMCL section).
    # These two files are a duplicated source of AMCL config by design (the
    # standalone amcl.yaml + localization.launch.py stay as a lightweight
    # map+AMCL-only entry point) - if AMCL tuning changes, update both.
    set_initial_pose: true
    initial_pose:
      x: -0.030
      y: 0.357
      z: 0.0
      yaw: -0.027
    # Switched from OmniMotionModel to DifferentialMotionModel for the 2WD +
    # caster transition (confirmed real via `strings` on libamcl_core.so -
    # nav2_amcl::DifferentialMotionModel exists alongside OmniMotionModel).
    # Omni modeled the old 4-wheel mecanum platform's holonomic strafing
    # capability in AMCL's particle motion prediction; a 2WD diff-drive robot
    # physically cannot strafe, so leaving Omni here would let the particle
    # filter predict lateral motion the real (and simulated) robot can never
    # produce - a silent motion-model mismatch, not just a missed
    # optimization.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500
    max_particles: 2000
    # Tightened for mecanum wheel slip in narrow doorways - a slipping
    # wheel makes odometry-only prediction between updates unreliable, so
    # correcting against the LiDAR scan more often (every 5cm/~3deg
    # instead of 10cm/~4.6deg) limits how far dead reckoning can drift
    # before the next correction.
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 12.0
    max_beams: 80                    # reduced from 180 to cut AMCL ray-casting CPU load during doorway traversal

planner_server:
  ros__parameters:
    # The actual behavior tree in use (navigate_to_pose_w_replanning_and_recovery.xml,
    # confirmed - bt_navigator.default_nav_to_pose_bt_xml is unset, falls back
    # to this file) wraps ComputePathToPose in <RateController hz="1.0">, so
    # planner_server is only ever called ~once/second by design. 20.0 here
    # was never achievable and warned on nearly every cycle regardless of
    # planner performance - not a SmacPlanner2D slowness problem. Matched to
    # the BT's real cadence.
    expected_planner_frequency: 1.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.15
      max_iterations: 1000000
      # Real parameter name is max_on_approach_iterations (confirmed via
      # `strings` on libnav2_smac_planner_2d.so) - max_on_obstacle_iterations
      # doesn't exist and was a silent no-op.
      max_on_approach_iterations: 1000
      allow_unknown: true
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true
      # smooth_path removed: not a real SmacPlanner2D parameter (confirmed
      # absent from libnav2_smac_planner_2d.so - no on/off toggle exists at
      # all for its internal Smoother, which runs unconditionally as part of
      # createPlan()). This key never enabled or disabled anything.

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Nav2 controller publishes to /cmd_vel_raw, which routes into twist_mux.
    cmd_vel_topic: /cmd_vel_raw
    # controller_server has a real odom_topic parameter (confirmed via
    # `strings` on libcontroller_server_core.so) that was never set anywhere
    # in this file - it was defaulting to the stock "odom" topic, which
    # nothing in this project publishes (our real odometry source is
    # rf2o_laser_odometry's /odom_rf2o). DWB uses this for its own current-
    # velocity feedback (acceleration-limit checking, Oscillation critic,
    # etc.) - with no real odometry ever arriving, DWB had no accurate
    # picture of the robot's actual current velocity, which is a strong
    # candidate for the discontinuous-velocity-step symptom this task set
    # out to fix in the first place.
    odom_topic: /odom_rf2o

    # Plugin strings must be the exact pluginlib-registered name. nav2_controller's
    # progress/goal checkers register only a `type=` (C++ namespace, "::"), not a
    # `name=` alias - confirmed via nav2_controller's plugins.xml. The slash form
    # ("nav2_controller/SimpleProgressChecker") does not exist and would fail to load.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03  # lowered from 0.04 — tolerate even slower net displacement while threading gaps
      movement_time_allowance: 12.0   # raised from 10.0 — more time before a slow gap-squeeze reads as "stuck"
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08         # Tightened to 8 cm — clean hysteresis for goal settling
      yaw_goal_tolerance: 0.15        # ~8.6 degrees — prevents heading jitter at goal
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      goal_checker_id: "general_goal_checker" # Explicitly bind to our 8cm plugin
      xy_goal_tolerance: 0.08            # Must match general_goal_checker to avoid early/late stops
      yaw_goal_tolerance: 0.15           # Must match general_goal_checker (~8.6 deg)
      debug_trajectory_details: True
      # publish_eval_grid isn't a real DWBLocalPlanner parameter - confirmed
      # via `strings` on libdwb_core.so, whose actual declared names are
      # .publish_evaluation / .publish_global_plan / .publish_local_plan /
      # .publish_transformed_plan / .publish_trajectories /
      # .publish_cost_grid_pc. Using publish_evaluation here instead - the
      # real name for what "eval grid" was presumably asking for.
      publish_evaluation: true
      publish_global_plan: true
      publish_local_plan: true
      prune_plan: true
      prune_distance: 1.0
      min_vel_x: -0.35
      max_vel_x: 0.35
      # Lateral sampling disabled: was a deliberate tradeoff back when this
      # was a mecanum robot capable of strafing (giving up that capability
      # to eliminate crab-walking/trajectory flicker). Under the 2WD +
      # caster transition it's no longer a tradeoff at all - a differential-
      # drive robot has no lateral DOF, so min/max_vel_y must be 0 to match
      # physical reality, not just tuning preference.
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: 0.06
      max_vel_theta: 1.2             # responsive rotational velocity for heading alignment
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      # Kinematic parameters for DWB (Holonomic / Mecanum setup)
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -2.0

      # Trajectory generator and critics.
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      sim_time: 1.8               # shortened from 2.0 - shorter rollouts reject less often in tight channels where a 2.0s forward projection clips a wall that's actually still passable
      vx_samples: 25
      vy_samples: 1                # min_vel_y == max_vel_y == 0, so 1 sample (always 0.0) is all that's meaningful
      vtheta_samples: 35
      # PreferForward is a real registered dwb_critics plugin (confirmed
      # earlier via dwb_critics' plugins.xml: dwb_critics::PreferForwardCritic).
      # It penalizes non-forward-facing rollouts - paired with vy locked to
      # 0 above, this fully commits the planner to forward-nose driving.
      critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist", "PathAlign", "PreferForward"]
      Oscillation.scale: 3.0      # lower oscillation penalty — allows faster cornering without fluttering
      # Lowered further, 3.0 -> 1.5: paired with this task's steeper
      # inflation decay (global 4.0, local 3.0), the cost gradient right at
      # a passage wall is now much shallower than it was under the old
      # 0.20m/8-10.0 inflation - keeping BaseObstacle's scale high against a
      # shallow gradient would still reject valid close-to-wall rollouts
      # through <0.55m channels, just via critic weighting instead of raw
      # inflation cost. This is a deliberate trade: DWB now tolerates closer
      # wall proximity in exchange for actually fitting through doorways.
      BaseObstacle.scale: 1.5
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PathAlign.scale: 32.0       # raised from 24.0 — locks the local plan tighter onto the global path's centerline through gaps, trading corner-cutting smoothness for accuracy threading a passage
      PathAlign.forward_point_distance: 0.1
      PreferForward.scale: 4.0    # lowered from 6.0 — less resistance to the rotation component of a curving arc

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 1.0   # raised from 0.5 to absorb sim clock skips
      # Padded footprint for the 2WD+caster chassis: 26cm x 21cm (±0.13m x
      # ±0.105m). Physical chassis (rmp_bot geometry): ±0.10m x ±0.085m;
      # same +3cm X / +2cm Y safety margin convention as the old mecanum
      # footprint, covering sensor mounts and Webots AABB rounding. The
      # caster's own forward reach (x=0.1 + caster_radius 0.0075 = 0.1075m)
      # is already inside this ±0.13m half-length, so no separate asymmetric
      # allowance is needed for it.
      footprint: "[[-0.13, -0.105], [-0.13, 0.105], [0.13, 0.105], [0.13, -0.105]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0    # steepened from 8.0 - faster decay to zero-cost leaves a clear centerline through <0.55m channels
        inflation_radius: 0.10      # lowered from 0.12 - was creating high-cost barriers across narrow doorways/passages

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 1.0   # raised from 0.5 to absorb sim clock skips
      rolling_window: True
      # width/height must be integers - Costmap2DROS pre-declares these as
      # int-typed parameters in its C++ constructor (confirmed empirically:
      # 2.5 crashed controller_server with InvalidParameterTypeException,
      # "is of type {integer}, setting it to {double} is not allowed" -
      # matches the real webots_ros2_turtlebot reference config, which also
      # uses plain integers here). Internally still divided by `resolution`
      # to get cell counts, so a whole-number size loses nothing.
      width: 3
      height: 3
      resolution: 0.05
      # Padded footprint matches global_costmap — 26cm x 21cm (±0.13m x ±0.105m).
      footprint: "[[-0.13, -0.105], [-0.13, 0.105], [0.13, 0.105], [0.13, -0.105]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Real parameter names are raytrace_max_range/obstacle_max_range
          # (confirmed via `strings` on liblayers.so, the actual plugin
          # library ObstacleLayer is compiled into) - "raytrace_range" and
          # "obstacle_range" don't exist and would have been silently
          # ignored, leaving these at plugin defaults instead of 3.0/2.5.
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0    # steepened from 10.0 - matches global's decay-for-centerline logic, local layer now the more permissive of the two near walls
        inflation_radius: 0.08      # lowered from 0.10 - tighter local squeeze allowance for gap traversal

behavior_server:
  ros__parameters:
    use_sim_time: True
    cycle_frequency: 10.0
    # This has now been set to both "odom" and "map" across different tasks
    # in this project's history, each time with a comment claiming the other
    # was wrong. Settling it here with the actual verified reasoning: Spin/
    # BackUp/DriveOnHeading all run short, safety-critical motions checked
    # against the LOCAL costmap (see local_costmap.global_frame: odom above)
    # - they need to operate in the same frame that costmap does, not the
    # slower/jumpier map-frame AMCL estimate. odom is correct.
    global_frame: odom
    robot_base_frame: base_link
    # Real top-level parameter is transform_tolerance (confirmed via
    # `strings` on libbehavior_server_core.so) - "transform_timeout" doesn't
    # exist here (that name belongs to the older Foxy/Galactic-era
    # recoveries_server, not this installed Humble nav2_behaviors).
    transform_tolerance: 1.0   # raised from 0.1 — tolerates TF latency during recovery maneuvers
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Plugin strings must be the pluginlib-registered "name=" alias (slash
    # form) - confirmed via nav2_behaviors' behavior_plugin.xml, which
    # explicitly registers "nav2_behaviors/Spin" etc. as names, not just
    # types. The double-colon C++-namespace form ("nav2_behaviors::Spin")
    # does NOT match a registered name here and would fail to load -
    # opposite situation from nav2_controller's checkers, which register no
    # name= alias at all and require the double-colon type= form instead.
    spin:
      plugin: "nav2_behaviors/Spin"
      # max_rotational_vel/min_rotational_vel/rotational_acc_lim are real
      # Spin-specific parameters (confirmed via `strings` on
      # libnav2_spin_behavior.so) - they must nest here under "spin.", not
      # sit at the top level of behavior_server where they'd be silently
      # ignored (every per-behavior TimedBehavior parameter follows this
      # nesting convention, same as progress_checker/general_goal_checker).
      # Lowered from 0.8: the task asked to "suppress aggressive spin
      # recoveries to prevent corner sweeping into side walls" but gave no
      # concrete parameter for it - and there isn't a clean one. Spin's
      # swept radius (0.214m, this footprint's outer corner) is fixed by
      # chassis geometry, not by velocity, and nav2_behaviors has no
      # channel-width-aware gate: the BT's recovery subtree tries Spin
      # unconditionally regardless of how tight the surrounding costmap is.
      # Slowing the rotation doesn't shrink the swept circle, it only
      # reduces impact energy and gives the local costmap collision check
      # more cycles to catch a clipped wall before it compounds - a partial
      # mitigation, not the "suppression" asked for. Real suppression would
      # require editing the BT XML to skip <Spin> when the local costmap
      # is too tight, which is out of scope for a params-only change.
      max_rotational_vel: 0.5
      min_rotational_vel: 0.1
      rotational_acc_lim: 1.5
      # spin_dist/spin_speed removed: never real parameters for this plugin
      # at all (confirmed absent from libnav2_spin_behavior.so) - Spin's
      # target angle/speed come from the BT action goal (the <Spin> node's
      # own XML attributes), not a YAML parameter. This was dead config
      # since Milestone 3, uncaught until now.
    backup:
      plugin: "nav2_behaviors/BackUp"
      # backup_dist/backup_speed removed: same story as spin_dist/spin_speed
      # above - confirmed absent from libnav2_back_up_behavior.so across
      # multiple checks this project. BackUp's distance/speed come from the
      # BT's own <BackUp backup_dist=".." backup_speed=".."/> node
      # attributes, not nav2_params.yaml. time_allowance is equally fake -
      # not found in any behavior plugin library. None of these three have
      # ever done anything as configured here.
      simulate_ahead_time: 1.0 # raised from 0.4 - longer rear-clearance check window so BackUp doesn't abort against the local costmap's tightened inflation
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    # bt_navigator has no "odom_frame" parameter (confirmed via `strings` on
    # libbt_navigator_core.so - only "odom_topic" exists, a topic name, not
    # a TF frame). Updated to /odom_rf2o to match rf2o_params.yaml's rename
    # (was /rf2o/odom) - left pointed at the old name here, this would have
    # silently gone stale the moment RF2O stopped publishing it.
    odom_topic: /odom_rf2o
    # No default_bt_xml_filename here: this build's real parameter name is
    # "default_nav_to_pose_bt_xml" (confirmed via `strings` on
    # libbt_navigator_core.so), and leaving it unset already makes
    # bt_navigator fall back to its own built-in default - which resolves,
    # via its own package share directory, to exactly this same file:
    # navigate_to_pose_w_replanning_and_recovery.xml. Setting the wrong key
    # would have been a silent no-op anyway.

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    # Bridges controller_server's raw /cmd_vel_raw output to /cmd_vel_smoothed
    # (twist_mux's navigation channel - see twist_mux.yaml). Clamps velocity
    # step-changes to the acc/decel budget, eliminating:
    #   - Motor stutter from abrupt Twist transitions between DWB cycles
    #   - Turn overshoot from instantaneous omega commands
    # No "plugin" key here: VelocitySmoother is a standalone lifecycle node,
    # not a pluginlib-loaded plugin - confirmed via `strings` on
    # libvelocity_smoother_core.so, which declares no such parameter. This
    # node was also never actually launched anywhere until now (see
    # navigation.launch.py) - every velocity_smoother setting in this file
    # was dead config until this fix.
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.35, 0.0, -1.2]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    # odom_topic/odom_duration are unused while feedback is OPEN_LOOP (no
    # actual velocity feedback loop - DWB already handles trajectory
    # consistency), but set correctly anyway in case feedback is ever
    # switched to CLOSED_LOOP.
    odom_topic: /odom_rf2o
    odom_duration: 0.1
